name: auto-signin

permissions:
  contents: read

on:
  workflow_dispatch:
  schedule:
    - cron: '0 23 * * *'
    #在这里设置运行时间，如果不知道怎么配置可以问AI
    #实际运行时间会比设置时间延迟一小时以内，取决于当时github资源占用情况。
jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: 'Set up Python'
        uses: actions/setup-python@v5
        with:
          python-version: 3.7

      - name: 'Install requirements'
        run: |
          pip install --upgrade pip
          pip install -r ./requirements.txt

      - name: Prepare chromedriver
        uses: nanasess/setup-chromedriver@v2

      - name: 'Working'
        env:
          JLC_USERNAME: ${{ secrets.JLC_USERNAME }}
          JLC_PASSWORD: ${{ secrets.JLC_PASSWORD }}
        run: python ./jlc.py
